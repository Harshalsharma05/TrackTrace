version: "3.9"

services:
  backend:
    image: tracktrace-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tracktrace-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:admin%40123@host.docker.internal:5432/audio_fingerprint
      REDIS_URL: redis://host.docker.internal:6379
    restart: unless-stopped

  frontend:
    image: tracktrace-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tracktrace-frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_BASE_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
